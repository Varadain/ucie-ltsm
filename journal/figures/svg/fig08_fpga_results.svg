<text x="900.0" y="109" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#172033">Compact CSR wrapper — fitted result</text>
<text x="900.0" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#172033">824 / 24,624 logic elements (3%)</text>
<text x="900.0" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#172033">505 registers</text>
<text x="900.0" y="179" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#172033">119 / 151 pins (79%)</text>
<text x="900.0" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#172033">Fitter: SUCCESS; zero virtual pins</text>
<text x="900.0" y="221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#172033">Target: Cyclone 10 LP 10CL025YU256C8G</text>
<rect x="660" y="365" width="480" height="140" rx="12" fill="#F7E396" stroke="#172033" stroke-width="2.5"/>
<text x="900.0" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#172033">Internal-clock timing</text>
<text x="900.0" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">80 MHz (12.5 ns constraint)</text>
<text x="900.0" y="441" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">worst setup slack: +1.013 ns</text>
<text x="900.0" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">worst hold slack: +0.179 ns</text>
<text x="900.0" y="479" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">reported negative slack: 0</text>
<rect x="60" y="365" width="480" height="140" rx="12" fill="#FFF3BD" stroke="#172033" stroke-width="2.5"/>
<text x="300.0" y="394" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#172033">Why the wrapper changes feasibility</text>
<text x="300.0" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">Wide debug/status buses consume package pins</text>
<text x="300.0" y="441" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">CSR serializes diagnostics into byte reads</text>
<text x="300.0" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">Logic cost rises slightly; pin demand falls by 32</text>
<rect x="60" y="560" width="1080" height="65" rx="12" fill="#E9ECEF" stroke="#172033" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="600.0" y="589" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#172033">Qualification</text>
<text x="600.0" y="617" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" fill="#172033">No board pin locations or external I/O delays → internal timing evidence only; not board closure, ASIC PPA, or UCIe PHY performance</text>
<path d="M 540 195 L 660 195" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<rect x="468.0" y="172.0" width="264" height="21" fill="#FFFDF5"/>
<text x="600.0" y="187.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#172033">replace wide diagnostics with CSR</text>
