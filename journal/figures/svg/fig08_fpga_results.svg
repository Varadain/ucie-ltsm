<text x="300.0" y="109" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#172033">Wide core top — negative result</text>
<text x="300.0" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#172033">Mapping: 763 logic elements</text>
<text x="300.0" y="158" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#172033">505 registers</text>
<text x="300.0" y="179" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#172033">151 external pins</text>
<text x="300.0" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#172033">Fitter: FAILED at 151 / 151 pins</text>
<text x="300.0" y="221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#172033">No successful-fit timing claim</text>
