<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,4 L0,8 Z" fill="#172033"/></marker></defs>
<rect width="1200" height="675" fill="#FFFDF5"/>
<text x="600.0" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="bold" fill="#172033">Retained error and recovery behavior</text>
<rect x="50" y="80" width="240" height="130" rx="12" fill="#F8D7DA" stroke="#172033" stroke-width="2.5"/>
<text x="170.0" y="109" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#172033">Eligible events</text>
<text x="170.0" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">state timeout (highest)</text>
<text x="170.0" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">sideband protocol</text>
<text x="170.0" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">local fatal</text>
<rect x="360" y="80" width="260" height="130" rx="12" fill="#F7E396" stroke="#172033" stroke-width="2.5"/>
<text x="490.0" y="109" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#172033">Error manager</text>
<text x="490.0" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">accept one event</text>
<text x="490.0" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">retain pending request</text>
<text x="490.0" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">bound entry latency</text>
<rect x="700" y="80" width="220" height="130" rx="12" fill="#F8D7DA" stroke="#172033" stroke-width="2.5"/>
<text x="810.0" y="109" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#172033">TRAINERROR</text>
<text x="810.0" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">stable cause</text>
<text x="810.0" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">saturating event count</text>
<text x="810.0" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">clear protected here</text>
<rect x="985" y="80" width="165" height="130" rx="12" fill="#DFF0D8" stroke="#172033" stroke-width="2.5"/>
<text x="1067.5" y="109" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#172033">CSR view</text>
<text x="1067.5" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">cause</text>
<text x="1067.5" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">count</text>
<text x="1067.5" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">pending</text>
<rect x="360" y="330" width="260" height="115" rx="12" fill="#FFF3BD" stroke="#172033" stroke-width="2.5"/>
<text x="490.0" y="359" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#172033">Entry handshake</text>
<text x="490.0" y="387" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">immediate or acknowledged</text>
<text x="490.0" y="406" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">manager timeout fallback</text>
<rect x="700" y="330" width="220" height="115" rx="12" fill="#DDEBF7" stroke="#172033" stroke-width="2.5"/>
<text x="810.0" y="359" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#172033">Recovery route</text>
<text x="810.0" y="387" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">return to RESET</text>
<text x="810.0" y="406" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">clear only when allowed</text>
<rect x="360" y="535" width="560" height="75" rx="12" fill="#E9E0F7" stroke="#172033" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="640.0" y="564" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#172033">SVA invariants</text>
<text x="640.0" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#172033">pending holds request  |  entry is bounded  |  log is stable  |  illegal clear is ignored</text>
<path d="M 290 145 L 360 145" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="269.0" y="122.0" width="112" height="21" fill="#FFFDF5"/>
<text x="325.0" y="137.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#172033">fixed priority</text>
<path d="M 620 145 L 700 145" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="625.0" y="122.0" width="70" height="21" fill="#FFFDF5"/>
<text x="660.0" y="137.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#172033">request</text>
<path d="M 920 145 L 985 145" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="888.5" y="122.0" width="128" height="21" fill="#FFFDF5"/>
<text x="952.5" y="137.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#172033">read-only status</text>
<path d="M 490 210 L 490 330" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 620 385 L 660 385 L 660 245 L 810 245 L 810 210" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="677.0" y="271.0" width="70" height="21" fill="#FFFDF5"/>
<text x="712.0" y="286.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#172033">entered</text>
<path d="M 810 210 L 810 330" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<rect x="775.0" y="247.0" width="70" height="21" fill="#FFFDF5"/>
<text x="810.0" y="262.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#172033">recover</text>
<path d="M 810 445 L 810 535" fill="none" stroke="#172033" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="8 6"/>
<rect x="775.0" y="467.0" width="70" height="21" fill="#FFFDF5"/>
<text x="810.0" y="482.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#172033">checked</text>
<text x="55" y="265" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#172033">Priority is deterministic when events coincide</text>
</svg>
