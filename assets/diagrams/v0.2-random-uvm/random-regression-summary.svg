<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">v0.2 constrained-domain randomized UVM results</title>
  <desc id="desc">Five seeded runs, forty transactions per seed, with stacked outcome counts and aggregate predictor-checked results.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/></filter>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#0f172a}.subtitle{font:20px Arial,sans-serif;fill:#475569}
      .section{font:700 24px Arial,sans-serif;fill:#172033}.label{font:700 21px Arial,sans-serif;fill:#172033}
      .axis{font:17px Arial,sans-serif;fill:#64748b}.legend{font:18px Arial,sans-serif;fill:#334155}
      .segment{font:700 18px Arial,sans-serif;fill:#fff}.card-value{font:700 34px Arial,sans-serif;fill:#0f172a}
      .card-label{font:18px Arial,sans-serif;fill:#475569}.verdict{font:700 22px Arial,sans-serif;fill:#14532d}
      .small{font:17px Arial,sans-serif;fill:#475569}.link{font:700 18px Arial,sans-serif;fill:#1d4ed8}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="116" fill="#e0f2fe"/>
  <text id="summary-title" class="title" x="50" y="48">v0.2 constrained-domain randomized UVM results</text>
  <text class="subtitle" x="50" y="82">Questa 2023.3 · five reproducible seeds · 40 transactions per seed · independent 1–3 cycle request/response delays</text>

  <g id="legend">
    <rect x="270" y="135" width="22" height="22" rx="4" fill="#16a34a"/><text class="legend" x="303" y="153">Immediate success</text>
    <rect x="500" y="135" width="22" height="22" rx="4" fill="#2563eb"/><text class="legend" x="533" y="153">Retry success</text>
    <rect x="700" y="135" width="22" height="22" rx="4" fill="#f59e0b"/><text class="legend" x="733" y="153">Wrong response</text>
    <rect x="930" y="135" width="22" height="22" rx="4" fill="#dc2626"/><text class="legend" x="963" y="153">Retry exhaustion</text>
  </g>

  <g id="stacked-chart" filter="url(#shadow)">
    <rect x="50" y="180" width="1500" height="420" rx="18" fill="#fff" stroke="#cbd5e1"/>
    <text class="section" x="80" y="220">Outcome distribution by simulator seed</text>
    <text class="axis" x="270" y="257">0</text><text class="axis" x="510" y="257">10</text><text class="axis" x="760" y="257">20</text><text class="axis" x="1010" y="257">30</text><text class="axis" x="1255" y="257">40 trials</text>
    <line x1="270" y1="268" x2="270" y2="558" stroke="#cbd5e1"/><line x1="520" y1="268" x2="520" y2="558" stroke="#e2e8f0"/><line x1="770" y1="268" x2="770" y2="558" stroke="#e2e8f0"/><line x1="1020" y1="268" x2="1020" y2="558" stroke="#e2e8f0"/><line x1="1270" y1="268" x2="1270" y2="558" stroke="#cbd5e1"/>

    <text class="label" x="85" y="307">Seed 101</text>
    <rect x="270" y="278" width="225" height="42" rx="7" fill="#16a34a"/><text class="segment" x="382" y="305" text-anchor="middle">9</text>
    <rect x="495" y="278" width="200" height="42" fill="#2563eb"/><text class="segment" x="595" y="305" text-anchor="middle">8</text>
    <rect x="695" y="278" width="350" height="42" fill="#f59e0b"/><text class="segment" x="870" y="305" text-anchor="middle">14</text>
    <rect x="1045" y="278" width="225" height="42" rx="7" fill="#dc2626"/><text class="segment" x="1157" y="305" text-anchor="middle">9</text>

    <text class="label" x="85" y="365">Seed 202</text>
    <rect x="270" y="336" width="350" height="42" rx="7" fill="#16a34a"/><text class="segment" x="445" y="363" text-anchor="middle">14</text>
    <rect x="620" y="336" width="225" height="42" fill="#2563eb"/><text class="segment" x="732" y="363" text-anchor="middle">9</text>
    <rect x="845" y="336" width="225" height="42" fill="#f59e0b"/><text class="segment" x="957" y="363" text-anchor="middle">9</text>
    <rect x="1070" y="336" width="200" height="42" rx="7" fill="#dc2626"/><text class="segment" x="1170" y="363" text-anchor="middle">8</text>

    <text class="label" x="85" y="423">Seed 303</text>
    <rect x="270" y="394" width="200" height="42" rx="7" fill="#16a34a"/><text class="segment" x="370" y="421" text-anchor="middle">8</text>
    <rect x="470" y="394" width="275" height="42" fill="#2563eb"/><text class="segment" x="607" y="421" text-anchor="middle">11</text>
    <rect x="745" y="394" width="250" height="42" fill="#f59e0b"/><text class="segment" x="870" y="421" text-anchor="middle">10</text>
    <rect x="995" y="394" width="275" height="42" rx="7" fill="#dc2626"/><text class="segment" x="1132" y="421" text-anchor="middle">11</text>

    <text class="label" x="85" y="481">Seed 404</text>
    <rect x="270" y="452" width="150" height="42" rx="7" fill="#16a34a"/><text class="segment" x="345" y="479" text-anchor="middle">6</text>
    <rect x="420" y="452" width="275" height="42" fill="#2563eb"/><text class="segment" x="557" y="479" text-anchor="middle">11</text>
    <rect x="695" y="452" width="350" height="42" fill="#f59e0b"/><text class="segment" x="870" y="479" text-anchor="middle">14</text>
    <rect x="1045" y="452" width="225" height="42" rx="7" fill="#dc2626"/><text class="segment" x="1157" y="479" text-anchor="middle">9</text>

    <text class="label" x="85" y="539">Seed 505</text>
    <rect x="270" y="510" width="250" height="42" rx="7" fill="#16a34a"/><text class="segment" x="395" y="537" text-anchor="middle">10</text>
    <rect x="520" y="510" width="175" height="42" fill="#2563eb"/><text class="segment" x="607" y="537" text-anchor="middle">7</text>
    <rect x="695" y="510" width="400" height="42" fill="#f59e0b"/><text class="segment" x="895" y="537" text-anchor="middle">16</text>
    <rect x="1095" y="510" width="175" height="42" rx="7" fill="#dc2626"/><text class="segment" x="1182" y="537" text-anchor="middle">7</text>
  </g>

  <text class="section" x="50" y="652">Aggregate predictor-checked observations</text>
  <g id="aggregate-cards" filter="url(#shadow)">
    <g><rect x="50" y="680" width="280" height="128" rx="16" fill="#fff" stroke="#cbd5e1"/><text class="card-value" x="190" y="735" text-anchor="middle">200</text><text class="card-label" x="190" y="773" text-anchor="middle">random transactions</text></g>
    <g><rect x="355" y="680" width="280" height="128" rx="16" fill="#fff" stroke="#cbd5e1"/><text class="card-value" x="495" y="735" text-anchor="middle">290</text><text class="card-label" x="495" y="773" text-anchor="middle">accepted requests</text></g>
    <g><rect x="660" y="680" width="280" height="128" rx="16" fill="#fff" stroke="#cbd5e1"/><text class="card-value" x="800" y="735" text-anchor="middle">93</text><text class="card-label" x="800" y="773" text-anchor="middle">successful exits</text></g>
    <g><rect x="965" y="680" width="280" height="128" rx="16" fill="#fff" stroke="#cbd5e1"/><text class="card-value" x="1105" y="735" text-anchor="middle">90</text><text class="card-label" x="1105" y="773" text-anchor="middle">bounded retries</text></g>
    <g><rect x="1270" y="680" width="280" height="128" rx="16" fill="#fff" stroke="#cbd5e1"/><text class="card-value" x="1410" y="735" text-anchor="middle">107</text><text class="card-label" x="1410" y="773" text-anchor="middle">protocol errors</text></g>
  </g>

  <g id="verdicts" filter="url(#shadow)">
    <rect x="50" y="855" width="475" height="105" rx="16" fill="#dcfce7" stroke="#86efac"/><text class="verdict" x="287" y="900" text-anchor="middle">5 / 5 seeds passed</text><text class="small" x="287" y="932" text-anchor="middle">Every seed hit all four outcomes</text>
    <rect x="562" y="855" width="475" height="105" rx="16" fill="#dcfce7" stroke="#86efac"/><text class="verdict" x="799" y="900" text-anchor="middle">0 UVM errors / fatals</text><text class="small" x="799" y="932" text-anchor="middle">All predictor totals matched</text>
    <rect x="1075" y="855" width="475" height="105" rx="16" fill="#dcfce7" stroke="#86efac"/><text class="verdict" x="1312" y="900" text-anchor="middle">0 illegal transitions</text><text class="small" x="1312" y="932" text-anchor="middle">Eight deterministic tests also passed</text>
  </g>

  <a href="../../../docs/06_results/questa.md#seeded-randomized-regression"><text class="link" x="50" y="1025">Detailed seed results and rerun command ↗</text></a>
  <a href="../../../docs/05_verification/sideband_sequencer.md#randomized-campaign"><text class="link" x="1550" y="1025" text-anchor="end">Stimulus domains, predictor, and limitations ↗</text></a>
</svg>
