<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">v0.4 retained and classified TRAINERROR RTL connections</title>
  <desc id="desc">Implemented digital connections among the LTSM, error sources, error manager, handshake, retained log, and TRAINERROR transition.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}
      .title{font-size:28px;font-weight:700}.subtitle{font-size:15px;fill:#536179}
      .head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#475569}
      .link{font-size:14px;font-weight:650;fill:#2563eb;text-decoration:underline}
      .wire{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#ffffff"/>
  <text class="title" x="40" y="44">v0.4 retained and classified TRAINERROR — implemented RTL</text>
  <text class="subtitle" x="40" y="74">Digital control/error recovery only · exact cause retention, bounded handshake, event counting, and controlled log clearing</text>
  <a href="../../../docs/04_rtl/README.md#v04-error-manager"><text class="link" x="1560" y="74" text-anchor="end">RTL explanation ↗</text></a>

  <rect x="45" y="132" width="365" height="190" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="head" x="70" y="166" fill="#9a3412">Accepted error sources</text>
  <text class="body" x="70" y="202">state_timeout_i</text>
  <text class="small" x="70" y="226">Immediate entry; highest retained priority</text>
  <text class="body" x="70" y="258">sideband_protocol_error_i</text>
  <text class="small" x="70" y="282">Immediate in SBINIT; second priority</text>
  <text class="body" x="70" y="310">local_fatal_error_i</text>

  <rect x="45" y="360" width="365" height="175" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="head" x="70" y="394" fill="#1d4ed8">Context and controls</text>
  <text class="body" x="70" y="430">state_i · handshake_done_i</text>
  <text class="body" x="70" y="464">clear_log_i · rst_ni · clk_i</text>
  <text class="small" x="70" y="500">RESET/TRAINERROR block new acceptance</text>

  <rect x="520" y="120" width="560" height="520" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text class="head" x="800" y="160" text-anchor="middle" fill="#6d28d9">ucie_error_manager</text>

  <rect x="555" y="188" width="490" height="92" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text class="head" x="580" y="219">Acceptance gate</text>
  <text class="body" x="580" y="249">eligible state ∧ no pending event ∧ new fault</text>
  <text class="small" x="580" y="270">Held/repeated levels are accepted once while pending</text>

  <rect x="555" y="302" width="490" height="102" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text class="head" x="580" y="333">Pending register + bounded timer</text>
  <text class="body" x="580" y="365">Request stays asserted until acknowledgment or timeout</text>
  <text class="small" x="580" y="389">Pending clears on TRAINERROR entry or RESET</text>

  <rect x="555" y="426" width="490" height="92" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text class="head" x="580" y="457">Fixed cause classifier</text>
  <text class="body" x="580" y="489">state timeout › sideband protocol › local fatal</text>
  <text class="small" x="580" y="510">Cause is captured only for an accepted event</text>

  <rect x="555" y="540" width="490" height="72" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text class="head" x="580" y="571">Retained 16-bit event log</text>
  <text class="body" x="580" y="598">Increment once · saturate at 16'hffff · controlled clear</text>

  <rect x="1190" y="132" width="365" height="130" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="head" x="1215" y="166" fill="#1d4ed8">Handshake outputs</text>
  <text class="body" x="1215" y="202">trainerror_handshake_request_o</text>
  <text class="body" x="1215" y="232">error_pending_o · timeout_o</text>

  <rect x="1190" y="300" width="365" height="130" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text class="head" x="1215" y="334" fill="#b91c1c">Global entry decision</text>
  <text class="body" x="1215" y="370">enter_trainerror_o</text>
  <text class="small" x="1215" y="400">Overrides normal next-state behavior</text>

  <rect x="1190" y="468" width="365" height="142" rx="14" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text class="head" x="1215" y="502" fill="#15803d">Retained diagnostics</text>
  <text class="body" x="1215" y="538">error_cause_o[2:0]</text>
  <text class="body" x="1215" y="570">error_event_count_o[15:0]</text>
  <text class="small" x="1215" y="594">Stable throughout TRAINERROR residency</text>

  <path class="wire" d="M410 228 H520"/>
  <path class="wire" d="M410 448 H520"/>
  <path class="wire" d="M1080 197 H1190"/>
  <path class="wire" d="M1080 365 H1190"/>
  <path class="wire" d="M1080 539 H1190"/>

  <rect x="485" y="690" width="630" height="96" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2.5"/>
  <text class="head" x="800" y="726" text-anchor="middle" fill="#991b1b">ucie_ltsm next-state priority</text>
  <text class="body" x="800" y="756" text-anchor="middle">enter_trainerror → LTSM_TRAINERROR → wait for !error_escalated_i and sideband_tx_idle_i → RESET</text>
  <path class="wire" d="M800 640 V690"/>

  <rect x="45" y="838" width="1510" height="82" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text class="head" x="70" y="871">Scope boundary</text>
  <text class="body" x="70" y="901">Synthesizable digital control and retained status only. No analog PHY fault sensing, CDC hardening, packet corruption model, software servicing, BER evidence, or UCIe compliance claim.</text>
</svg>
