<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Original standard-package interface and reference characteristics diagram</title>
  <desc id="desc">A project-authored package cross-section with dies, bumps, organic substrate, and compact cards summarizing standard-package rates, pitch, reach, and raw BER reference targets.</desc>
  <defs>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:31px;font-weight:750}.subtitle{font-size:16px;fill:#526176}.head{font-size:20px;font-weight:700}.metric{font-size:25px;font-weight:750}.body{font-size:15px}.small{font-size:13px;fill:#526176}.badge{font-size:13px;font-weight:750}.link{font-size:14px;font-weight:650;fill:#2563eb;text-decoration:underline}.trace{fill:none;stroke:#0f766e;stroke-width:5;stroke-linecap:round}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="#ffffff"/>
  <text class="title" x="50" y="52">Standard-package interface: physical context and cited reference values</text>
  <text class="subtitle" x="50" y="82">Original cross-section and engineering reference cards — values below are manual targets, not measurements from this project</text>
  <a href="../../../docs/specification_figure_index.md#diagram-6-standard-package-interface-and-reference-characteristics"><text class="link" x="1750" y="82" text-anchor="end">Figure 1-3 / Table 1-1 locators &#8599;</text></a>

  <rect x="50" y="130" width="1700" height="500" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>
  <text class="head" x="85" y="175">Conceptual cross-section</text>
  <text class="small" x="85" y="203">not to scale; package geometry and channel implementation are outside the RTL scope</text>
  <rect x="180" y="490" width="1440" height="80" rx="16" fill="#fed7aa" stroke="#ea580c" stroke-width="3"/>
  <text class="head" x="900" y="522" text-anchor="middle" fill="#9a3412">Organic package substrate with routed die-to-die channel</text>
  <path class="trace" d="M420 550 H1380"/>
  <rect x="285" y="255" width="430" height="180" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text class="head" x="500" y="310" text-anchor="middle" fill="#1d4ed8">Die A</text>
  <text class="body" x="500" y="348" text-anchor="middle">protocol + adapter + PHY endpoint</text>
  <rect x="390" y="375" width="220" height="34" rx="17" fill="#eff6ff"/><text class="badge" x="500" y="398" text-anchor="middle" fill="#1d4ed8">UCIe-facing edge</text>
  <rect x="1085" y="255" width="430" height="180" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text class="head" x="1300" y="310" text-anchor="middle" fill="#6d28d9">Die B</text>
  <text class="body" x="1300" y="348" text-anchor="middle">protocol + adapter + PHY endpoint</text>
  <rect x="1190" y="375" width="220" height="34" rx="17" fill="#f5f3ff"/><text class="badge" x="1300" y="398" text-anchor="middle" fill="#6d28d9">UCIe-facing edge</text>
  <g fill="#475569">
    <circle cx="390" cy="457" r="11"/><circle cx="435" cy="457" r="11"/><circle cx="480" cy="457" r="11"/><circle cx="525" cy="457" r="11"/><circle cx="570" cy="457" r="11"/><circle cx="615" cy="457" r="11"/>
    <circle cx="1190" cy="457" r="11"/><circle cx="1235" cy="457" r="11"/><circle cx="1280" cy="457" r="11"/><circle cx="1325" cy="457" r="11"/><circle cx="1370" cy="457" r="11"/><circle cx="1415" cy="457" r="11"/>
  </g>
  <text class="small" x="500" y="480" text-anchor="middle">package bumps</text><text class="small" x="1300" y="480" text-anchor="middle">package bumps</text>
  <rect x="180" y="585" width="1440" height="18" rx="9" fill="#94a3b8"/>
  <text class="small" x="900" y="620" text-anchor="middle">board-facing package boundary</text>

  <text class="head" x="50" y="690">Manual reference characteristics — design inputs for an authorized reader</text>
  <g>
    <rect x="50" y="730" width="400" height="185" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text class="small" x="80" y="770">PER-LANE TRANSFER RATES</text>
    <text class="metric" x="80" y="815" fill="#1d4ed8">4 / 8 / 12 / 16</text>
    <text class="metric" x="80" y="850" fill="#1d4ed8">24 / 32 GT/s</text>
    <text class="small" x="80" y="888">discrete supported reference rates</text>
  </g>
  <g>
    <rect x="485" y="730" width="400" height="185" rx="20" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/>
    <text class="small" x="515" y="770">BUMP-PITCH RANGE</text>
    <text class="metric" x="515" y="828" fill="#15803d">100–130 µm</text>
    <text class="small" x="515" y="866">standard-package reference range</text>
    <text class="small" x="515" y="891">not a board or device constraint here</text>
  </g>
  <g>
    <rect x="920" y="730" width="400" height="185" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text class="small" x="950" y="770">CHANNEL REACH CLASSES</text>
    <text class="metric" x="950" y="815" fill="#c2410c">10 mm short reach</text>
    <text class="metric" x="950" y="850" fill="#c2410c">25 mm long reach</text>
    <text class="small" x="950" y="888">reference package-channel distances</text>
  </g>
  <g>
    <rect x="1355" y="730" width="395" height="185" rx="20" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
    <text class="small" x="1385" y="770">RAW BER TARGETS</text>
    <text class="metric" x="1385" y="815" fill="#6d28d9">10⁻²⁷ at ≤ 8 GT/s</text>
    <text class="metric" x="1385" y="850" fill="#6d28d9">10⁻¹⁵ at ≥ 12 GT/s</text>
    <text class="small" x="1385" y="888">specification targets; not project results</text>
  </g>

  <rect x="50" y="960" width="1700" height="115" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text class="head" x="80" y="1000" fill="#b91c1c">Evidence boundary</text>
  <text class="body" x="80" y="1035">No channel model, bump geometry, reach characterization, BER test, or electrical signoff exists in this repository. Source locator: Figure 1-3 and Table 1-1, printed page 37.</text>
  <text class="small" x="80" y="1062">Original project summary; it does not reproduce the source table layout or artwork.</text>
</svg>
