<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Original UCIe layer and project-boundary diagram</title>
  <desc id="desc">A project-authored view of protocol, die-to-die adapter, and physical layers separated by FDI and RDI, with project coverage highlighted only around digital physical-layer training control.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:31px;font-weight:750}.subtitle{font-size:16px;fill:#526176}.layer{font-size:23px;font-weight:750}.head{font-size:19px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#526176}.badge{font-size:13px;font-weight:750}.link{font-size:14px;font-weight:650;fill:#2563eb;text-decoration:underline}.flow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="#ffffff"/>
  <text class="title" x="50" y="52">UCIe functional layers with the repository boundary made explicit</text>
  <text class="subtitle" x="50" y="82">Original responsibility map — the orange panel marks the implemented digital-control island</text>
  <a href="../../../docs/specification_figure_index.md#diagram-7-ucie-layers-and-project-boundary"><text class="link" x="1750" y="82" text-anchor="end">Figure 1-8 locator and derivation notes &#8599;</text></a>

  <rect x="50" y="135" width="1120" height="800" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2.5"/>
  <rect x="95" y="185" width="1030" height="180" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text class="layer" x="135" y="235" fill="#1d4ed8">Protocol layer</text>
  <text class="small" x="135" y="265">transaction meaning and upper-protocol behavior</text>
  <rect x="530" y="215" width="250" height="105" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="head" x="655" y="257" text-anchor="middle">PCIe / CXL</text><text class="small" x="655" y="288" text-anchor="middle">example protocol families</text>
  <rect x="825" y="215" width="250" height="105" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="head" x="950" y="257" text-anchor="middle">Streaming / raw</text><text class="small" x="950" y="288" text-anchor="middle">implementation-selected use</text>

  <rect x="125" y="382" width="970" height="56" rx="28" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="head" x="610" y="418" text-anchor="middle" fill="#1d4ed8">FDI — interface between protocol and die-to-die adapter</text>

  <rect x="95" y="455" width="1030" height="220" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text class="layer" x="135" y="505" fill="#6d28d9">Die-to-die adapter</text>
  <text class="small" x="135" y="535">coordination and optional reliability</text>
  <rect x="420" y="495" width="190" height="125" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="head" x="515" y="535" text-anchor="middle">Arbitration</text><text class="small" x="515" y="564" text-anchor="middle">multiplexing and</text><text class="small" x="515" y="587" text-anchor="middle">protocol selection</text>
  <rect x="635" y="495" width="190" height="125" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="head" x="730" y="535" text-anchor="middle">Reliability</text><text class="small" x="730" y="564" text-anchor="middle">optional CRC</text><text class="small" x="730" y="587" text-anchor="middle">and retry</text>
  <rect x="850" y="495" width="225" height="125" rx="16" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="head" x="962" y="535" text-anchor="middle">Link management</text><text class="small" x="962" y="564" text-anchor="middle">state coordination and</text><text class="small" x="962" y="587" text-anchor="middle">parameter negotiation</text>

  <rect x="125" y="692" width="970" height="56" rx="28" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/>
  <text class="head" x="610" y="728" text-anchor="middle" fill="#6d28d9">RDI — interface between die-to-die adapter and physical layer</text>

  <rect x="95" y="765" width="1030" height="125" rx="22" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
  <text class="layer" x="135" y="815" fill="#15803d">Physical layer</text>
  <text class="body" x="365" y="810">link training • lane repair/reversal • scrambling • sideband • clock forwarding • analog front end</text>
  <text class="small" x="365" y="845">digital coordination and physical/electrical mechanisms coexist at this architectural layer</text>

  <path class="flow" d="M610 365 V382"/><path class="flow" d="M610 438 V455"/><path class="flow" d="M610 675 V692"/><path class="flow" d="M610 748 V765"/>

  <rect x="1230" y="135" width="520" height="800" rx="28" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text class="layer" x="1270" y="190" fill="#c2410c">This repository</text>
  <text class="small" x="1270" y="220">academic digital-control / FPGA milestone</text>
  <rect x="1270" y="265" width="440" height="270" rx="22" fill="#ffffff" stroke="#f97316" stroke-width="3"/>
  <rect x="1300" y="295" width="380" height="54" rx="27" fill="#dcfce7"/><text class="badge" x="1490" y="329" text-anchor="middle" fill="#15803d">IMPLEMENTED DIGITAL ISLAND</text>
  <text class="head" x="1310" y="395">Training-control subset</text>
  <text class="body" x="1310" y="430">• LTSM state sequencing</text>
  <text class="body" x="1310" y="461">• bounded sideband message control</text>
  <text class="body" x="1310" y="492">• LFSR training decision and recovery</text>
  <rect x="1270" y="580" width="440" height="265" rx="22" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text class="head" x="1310" y="625" fill="#b91c1c">Not implemented or validated</text>
  <text class="body" x="1310" y="663">• full protocol and adapter behavior</text>
  <text class="body" x="1310" y="696">• complete RDI / FDI data transport</text>
  <text class="body" x="1310" y="729">• analog front end and channel</text>
  <text class="body" x="1310" y="762">• BER, compliance, interoperability</text>
  <text class="body" x="1310" y="795">• electrical or ASIC signoff</text>

  <rect x="50" y="970" width="1700" height="105" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text class="head" x="80" y="1010" fill="#4338ca">Reference note</text>
  <text class="body" x="80" y="1043">Source locator: UCIe 2.0, Figure 1-8, printed page 40. The layout and project-overlay semantics are original and are not a reproduction of the specification figure.</text>
</svg>
