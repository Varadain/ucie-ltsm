  <rect x="50" y="880" width="1700" height="165" rx="20" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text class="head" x="80" y="920" fill="#4338ca">How to read this reference</text>
  <text class="body" x="80" y="957">The chiplet roles illustrate composability: compute, acceleration, memory control, and external I/O may be partitioned across dies and linked inside one package.</text>
  <text class="body" x="80" y="990">This repository implements only an academic digital training-control/FPGA subset. The package, memory, PCIe/CXL, channel, and electrical PHY shown here are context, not implemented blocks.</text>
  <text class="small" x="80" y="1022">Source locator: UCIe 2.0, Figure 1-1, printed page 36. Original project drawing; not a reproduction of specification artwork.</text>
</svg>
