<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Original package and chiplet composition reference diagram</title>
  <desc id="desc">A project-authored conceptual package containing two compute dies, an accelerator die, an IO tile, memory interfaces, and an internal UCIe connectivity plane.</desc>
