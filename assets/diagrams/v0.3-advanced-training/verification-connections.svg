<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">v0.3 DATATRAINCENTER1 verification connections</title>
  <desc id="desc">Seeded randomized UVM, independent LFSR reference checking, assertions, explicit coverage bins, directed boundary proof, and Quartus evidence.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:28px;font-weight:750}.subtitle{font-size:15px;fill:#536179}.box-title{font-size:18px;font-weight:750}.body{font-size:14px}.small{font-size:13px;fill:#475569}.signal{font-size:13px;font-weight:700}.scope{font-size:13px;font-weight:650;fill:#7c2d12}.link{font-size:13px;font-weight:650;fill:#2563eb;text-decoration:underline}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#ffffff"/>
  <text class="title" x="34" y="42">v0.3 DATATRAINCENTER1 verification connections</text>
  <text class="subtitle" x="34" y="70">Five reproducible seeds · independent 23-bit reference model · SVA · explicit sampled coverage · preserved regressions</text>
  <a href="../../../docs/06_results/datatrain_lfsr.md"><text class="link" x="1560" y="70" text-anchor="end">Measured results ↗</text></a>

  <rect x="34" y="108" width="260" height="98" rx="12" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
  <text class="box-title" x="164" y="142" text-anchor="middle" fill="#6b21a8">Seed and legal domains</text>
  <text class="small" x="164" y="170" text-anchor="middle">701 · 802 · 903 · 1004 · 1105</text>
  <text class="small" x="164" y="191" text-anchor="middle">scenario · gaps · corruption · threshold</text>

  <rect x="34" y="260" width="260" height="465" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text class="box-title" x="164" y="298" text-anchor="middle" fill="#6b21a8">UVM sequence</text>
  <text class="body" x="62" y="342">32 reset-isolated trials / seed</text>
  <text class="body" x="62" y="380">• direct pass</text>
  <text class="body" x="62" y="413">• fail then retry</text>
  <text class="body" x="62" y="446">• phase-driven abort</text>
  <text class="body" x="62" y="479">• LTSM timeout</text>
  <text class="body" x="62" y="527">Randomized legal dimensions:</text>
  <text class="small" x="62" y="557">0–3 receive-gap cycles</text>
  <text class="small" x="62" y="582">clean / 1–16 corrupt lanes</text>
  <text class="small" x="62" y="607">rotating error locations</text>
  <text class="small" x="62" y="632">threshold and abort sample</text>
  <text class="small" x="62" y="679">Seeded $urandom_range domains</text>
  <path d="M164 206 V260" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="384" y="260" width="290" height="465" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="box-title" x="529" y="298" text-anchor="middle" fill="#1d4ed8">Driver + reference model</text>
  <text class="body" x="416" y="342">Independent model calculates:</text>
  <text class="body" x="416" y="380">• eight lane seeds modulo 8</text>
  <text class="body" x="416" y="413">• 23-bit polynomial steps</text>
  <text class="body" x="416" y="446">• TX pattern for all 16 lanes</text>
  <text class="body" x="416" y="479">• corruption mask + popcount</text>
  <text class="body" x="416" y="512">• saturation and strict result</text>
  <rect x="424" y="562" width="210" height="104" rx="9" fill="#ffffff" stroke="#60a5fa"/>
  <text class="small" x="529" y="593" text-anchor="middle">Drives train_rx_valid_i</text>
  <text class="small" x="529" y="619" text-anchor="middle">and train_rx_pattern_i</text>
  <text class="small" x="529" y="645" text-anchor="middle">after pre-accept comparison</text>

  <rect x="774" y="238" width="310" height="510" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text class="box-title" x="929" y="278" text-anchor="middle" fill="#047857">DUT: ucie_ltsm</text>
  <text class="body" x="812" y="323">Integrated LFSR engine</text>
  <text class="body" x="812" y="356">MBT_DATATRAINCENTER1 only</text>
  <rect x="814" y="398" width="230" height="122" rx="9" fill="#ffffff" stroke="#34d399"/>
  <text class="small" x="929" y="431" text-anchor="middle">8 samples in UVM campaign</text>
  <text class="small" x="929" y="459" text-anchor="middle">4096 samples in directed proof</text>
  <text class="small" x="929" y="487" text-anchor="middle">16-bit saturating error count</text>
  <rect x="814" y="570" width="230" height="112" rx="9" fill="#ffffff" stroke="#34d399"/>
  <text class="small" x="929" y="602" text-anchor="middle">pass → DATATRAINVREF</text>
  <text class="small" x="929" y="628" text-anchor="middle">fail → repeat in CENTER1</text>
  <text class="small" x="929" y="654" text-anchor="middle">abort/timeout → clear</text>

  <rect x="1174" y="260" width="390" height="465" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="box-title" x="1369" y="298" text-anchor="middle" fill="#9a3412">Checkers and reports</text>
  <rect x="1214" y="334" width="310" height="92" rx="9" fill="#ffffff" stroke="#fb923c"/>
  <text class="body" x="1369" y="365" text-anchor="middle">UVM transition scoreboard</text>
  <text class="small" x="1369" y="394" text-anchor="middle">zero illegal top-level transitions</text>
  <rect x="1214" y="456" width="310" height="104" rx="9" fill="#ffffff" stroke="#fb923c"/>
  <text class="body" x="1369" y="487" text-anchor="middle">SVA integration invariants</text>
  <text class="small" x="1369" y="515" text-anchor="middle">busy/done/strict threshold/hold</text>
  <text class="small" x="1369" y="539" text-anchor="middle">zero assertion failures</text>
  <rect x="1214" y="590" width="310" height="92" rx="9" fill="#ffffff" stroke="#fb923c"/>
  <text class="body" x="1369" y="621" text-anchor="middle">Explicit sampled bins + crosses</text>
  <text class="small" x="1369" y="650" text-anchor="middle">all required bins hit; no UCDB claim</text>

  <path d="M294 430 H384" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="signal" x="339" y="412" text-anchor="middle" fill="#2563eb">items</text>
  <path d="M674 430 H774" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="signal" x="724" y="412" text-anchor="middle" fill="#2563eb">stimulus</text>
  <path d="M1084 430 H1174" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text class="signal" x="1129" y="412" text-anchor="middle" fill="#15803d">observed</text>

  <rect x="34" y="806" width="390" height="136" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text class="box-title" x="229" y="842" text-anchor="middle" fill="#0369a1">Directed boundary proof</text>
  <text class="small" x="229" y="873" text-anchor="middle">lane seeds · polynomial · equality fail · abort</text>
  <text class="small" x="229" y="899" text-anchor="middle">4096-sample completion · 16'hffff saturation</text>
  <path d="M229 806 V772 H734 V748 H844" fill="none" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="604" y="806" width="390" height="136" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text class="box-title" x="799" y="842" text-anchor="middle" fill="#854d0e">Preserved regression</text>
  <text class="small" x="799" y="873" text-anchor="middle">8 deterministic UVM · 5 sideband seeds</text>
  <text class="small" x="799" y="899" text-anchor="middle">base + sideband directed suites</text>

  <rect x="1174" y="806" width="390" height="136" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="box-title" x="1369" y="842" text-anchor="middle" fill="#166534">Release evidence</text>
  <text class="small" x="1369" y="873" text-anchor="middle">5/5 training seeds · 160 randomized trials</text>
  <text class="small" x="1369" y="899" text-anchor="middle">Quartus pass · reviewed waveform + netlist</text>
  <path d="M1369 725 V806" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-green)"/>

  <text class="scope" x="34" y="978">Scope: digital training-control verification; no native covergroup/UCDB percentage, analog PHY model, BER signoff, or full UCIe compliance claim.</text>
</svg>
